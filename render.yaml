# Configuration Render pour SIGEXPC
# Docs : https://render.com/docs/blueprint-spec
# Ce fichier permet à Render de créer automatiquement le service web.

services:
  - type: web
    name: sigexpc
    runtime: node
    plan: free
    region: frankfurt  # Europe (le plus proche de la Côte d'Ivoire)
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Base de données Supabase PostgreSQL (À CONFIGURER DANS RENDER)
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # Super admin par défaut
      - key: ADMIN_EMAIL
        value: admin@sigexpc.ci
      - key: ADMIN_PASSWORD
        value: ADMIN123
      # Abonnement
      - key: ABO_MONTANT
        value: 300
      - key: ABO_DUREE_JOURS
        value: 30
      # Email (SMTP) - À configurer
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Clés API GeniusPay - À configurer dans Render
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
