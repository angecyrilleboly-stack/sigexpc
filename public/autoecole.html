<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEXPC - Espace Auto-Écoles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIGEXPC">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css?v=20260819a">
  <style>
    /* Toast simple pour cette page autonome */
    #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    .toast-item { background: #1e3a8a; color: #fff; padding: 14px 22px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: slideIn 0.3s; max-width: 350px; font-size: 0.92rem; }
    .toast-item.success { background: #16a34a; }
    .toast-item.error { background: #dc2626; }
    .toast-item.info { background: #2563eb; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* Petit bandeau indicatif spécifique aux auto-écoles */
    .ae-banner {
      background: rgba(30, 58, 138, 0.08);
      border: 1px dashed #1e3a8a;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #1e3a8a;
      text-align: center;
      line-height: 1.4;
    }
    .ae-banner i { color: #1e3a8a; }
    .ae-banner a { color: #1e3a8a; font-weight: 600; text-decoration: none; }
    .ae-banner a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- ============================ TOASTS ============================ -->
  <div id="toastContainer"></div>

  <!-- ============================ ÉCRAN DE CONNEXION (design identique à la page principale) ============================ -->
  <div id="loginView" class="login-screen">
    <div class="login-card">

      <img src="/img/logo.png" alt="SIGEXPC Logo" style="width: 250px; height: auto; margin-bottom: 15px; border-radius: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.1);">

      <div class="ae-banner">
        <i class="fas fa-car"></i> <b>Espace réservé aux Auto-Écoles</b>
      </div>

      <input id="lEmail" type="email" placeholder="Email de l'auto-école">
      <input id="lPass" type="password" placeholder="Code secret d'accès">

      <button class="btn-main" id="btnLogin" style="margin-top: 15px; font-size: 1.1rem;"><i class="fas fa-key"></i> DÉMARRER LA SESSION</button>

      <div id="loginError" class="error-sign"></div>

    </div>
  </div>

  <!-- ============================ ÉCRAN DE PAIEMENT (AE bloquée) - GeniusPay ============================ -->
  <div id="paymentView" class="login-screen" style="display:none;">
    <div class="login-card" style="max-width:420px; border-color:#f59e0b !important;">
      <img src="/img/logo.png" alt="SIGEXPC Logo" style="width: 200px; height: auto; margin: 0 auto 15px; display: block; border-radius: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.1);">
      <div style="font-size: 4rem; color: #dc2626; margin-bottom: 10px;"><i class="fas fa-credit-card"></i></div>
      <h2 style="margin: 0; text-transform: uppercase; font-weight: 700; color: #dc2626;">Paiement de l'Abonnement</h2>
      <p style="color: #475569; font-size: 1rem; margin: 10px 0 20px; line-height: 1.6;">
        Votre abonnement à <strong>SIGEXPC</strong> est arrivé à expiration.<br>
        Veuillez procéder au paiement pour réactiver votre accès.
      </p>
      <div style="background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 25px; text-align: left;">
        <div style="margin-bottom: 12px;">
          <span style="display: block; color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 600;">Auto-École</span>
          <span id="payAEName" style="font-size: 1.4rem; font-weight: 700; color: #1e3a8a;">Chargement...</span>
        </div>
        <div>
          <span style="display: block; color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 600;">Tarif Mensuel</span>
          <span id="payMontant" style="font-size: 2.5rem; font-weight: 900; color: #0f172a;">— FCFA</span>
        </div>
      </div>
      <button class="btn-main" id="btnPayNow" onclick="redirectToGeniusPay()" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 1.2rem; cursor: pointer; box-shadow: 0 8px 20px rgba(30, 58, 138, 0.4); transition: transform 0.2s;">
        <i class="fas fa-credit-card"></i> PAYER MAINTENANT
      </button>
      <button onclick="backToLogin()" style="background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 12px; font-family: inherit; font-size: 0.95rem;">
        <i class="fas fa-undo"></i> Retour à la connexion
      </button>
    </div>
  </div>

<script>
// ============================================================================
//  JS dédié à la page /autoecole — connexion réservée AUTO_ECOLE
// ============================================================================
let _blockedAeId = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast-item ' + (type || 'info');
  t.innerHTML = (type === 'success' ? '<i class="fas fa-check-circle"></i> ' : type === 'error' ? '<i class="fas fa-exclamation-circle"></i> ' : '<i class="fas fa-info-circle"></i> ') + esc(msg);
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 4000);
}

// Détection d'un retour paiement (?paid=) ou d'une expiration (?expired=1)
(function checkReturn() {
  const params = new URLSearchParams(window.location.search);
  const paid = params.get('paid');
  const expired = params.get('expired');

  if (paid === 'success') {
    setTimeout(() => toast('Paiement confirmé ! Votre abonnement est réactivé. Vous pouvez vous connecter.', 'success'), 600);
  } else if (paid === 'failure') {
    setTimeout(() => toast('Le paiement n\'a pas abouti. Veuillez réessayer.', 'error'), 600);
  }

  // Expiration détectée en cours de session : afficher directement l'écran de paiement
  // avec les infos stockées par api.js (sessionStorage).
  if (expired === '1') {
    try {
      const info = JSON.parse(sessionStorage.getItem('sigexpc_blocked') || '{}');
      if (info.aeId) {
        _blockedAeId = info.aeId;
        document.getElementById('payAEName').innerText = info.aeName || '—';
        const montant = Number(info.montant || 200);
        document.getElementById('payMontant').innerText = montant.toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('paymentView').style.display = 'flex';
        setTimeout(() => toast('Votre abonnement a expiré. Veuillez régulariser pour continuer.', 'error'), 400);
      }
    } catch (e) {}
    sessionStorage.removeItem('sigexpc_blocked');
  }

  // Nettoyer l'URL
  if (paid || expired) {
    window.history.replaceState({}, document.title, '/autoecole');
  }
})();

// ---------- Connexion (réservée AUTO_ECOLE) ----------
async function handleLogin() {
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');

  errBox.classList.remove('show');
  if (!email || !pass) {
    errBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i><div><b>Champs manquants</b><br>Veuillez renseigner l\'email et le code secret.</div>';
    errBox.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

  try {
    // Toujours forcer le rôle AUTO_ECOLE (cette page est réservée aux auto-écoles)
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, motDePasse: pass, role: 'AUTO_ECOLE' })
    }).then(r => r.json());

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-key"></i> DÉMARRER LA SESSION';

    if (res.success) {
      // Connexion OK → redirige vers l'app principale (déjà authentifié via cookie)
      toast('Connexion réussie ! Redirection...', 'success');
      setTimeout(() => { window.location.href = '/'; }, 700);
    } else if (res.isBlocked) {
      // AE suspendue → afficher l'écran de paiement
      _blockedAeId = res.aeId;
      document.getElementById('payAEName').innerText = res.aeName || '—';
      const montant = Number(res.montant || 200);
      document.getElementById('payMontant').innerText = montant.toLocaleString('fr-FR') + ' FCFA';
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('paymentView').style.display = 'flex';
      toast('Abonnement expiré. Paiement requis.', 'error');
    } else {
      errBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i><div><b>Accès refusé</b><br>${esc(res.msg || res.error || 'Identifiants incorrects.')}</div>`;
      errBox.classList.add('show');
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-key"></i> DÉMARRER LA SESSION';
    errBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i><div><b>Erreur réseau</b><br>${esc(e.message)}</div>`;
    errBox.classList.add('show');
  }
}

function backToLogin() {
  document.getElementById('paymentView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('lEmail').value = '';
  document.getElementById('lPass').value = '';
}

// Redirection vers GeniusPay pour paiement d'abonnement
async function redirectToGeniusPay() {
  const btn = document.getElementById('btnPayNow');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirection...';
  try {
    const res = await fetch('/api/abonnements/initier-paiement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ aeId: _blockedAeId, returnUrl: '/autoecole' })
    }).then(r => r.json());
    if (res.success && res.checkoutUrl) {
      toast('Redirection vers GeniusPay...', 'success');
      window.location.href = res.checkoutUrl;
    } else {
      toast(res.msg || 'Erreur lors de la génération du lien de paiement.', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-credit-card"></i> PAYER MAINTENANT';
    }
  } catch (e) {
    toast('Erreur réseau : ' + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-credit-card"></i> PAYER MAINTENANT';
  }
}

document.getElementById('btnLogin').addEventListener('click', handleLogin);
document.getElementById('lPass').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

// Enregistrer le Service Worker (PWA)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
}
</script>
</body>
</html>
