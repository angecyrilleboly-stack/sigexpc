<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - SIGEXPC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center;
           min-height:100vh; background:linear-gradient(135deg,#0f172a,#1e3a8a); color:#fff; text-align:center; }
    .offline-card { background:rgba(255,255,255,0.05); backdrop-filter:blur(10px);
                    padding:50px 40px; border-radius:24px; border:1px solid rgba(255,255,255,0.1);
                    max-width:450px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .offline-icon { width:100px; height:100px; margin:0 auto 25px; border-radius:50%;
                    background:rgba(245,158,11,0.15); display:flex; align-items:center; justify-content:center;
                    font-size:3rem; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.1);opacity:0.8;} }
    h1 { font-size:1.6rem; font-weight:800; margin-bottom:12px; }
    p { color:#94a3b8; line-height:1.6; margin-bottom:25px; }
    .btn { background:linear-gradient(135deg,#1e3a8a,#3b82f6); color:#fff; border:none;
           padding:14px 35px; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer;
           box-shadow:0 6px 20px rgba(59,130,246,0.4); transition:transform 0.2s; }
    .btn:hover { transform:translateY(-2px); }
    .brand { position:fixed; top:20px; left:50%; transform:translateX(-50%); font-size:1.2rem; font-weight:800;
             letter-spacing:2px; color:#fbbf24; opacity:0.8; }
  </style>
</head>
<body>
  <div class="brand">SIGEXPC</div>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet puis réessayez.<br>
       Certaines données déjà consultées restent disponibles.</p>
    <button class="btn" onclick="location.reload()"><i class="fas fa-rotate-right"></i> Réessayer</button>
  </div>
</body>
</html>
