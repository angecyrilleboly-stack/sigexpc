<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEXPC - Examen du Permis de Conduire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; font-family:'Segoe UI',system-ui,sans-serif; }
    #canvas3d { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

    .ui-overlay { position:fixed; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; }
    .top-bar { display:flex; justify-content:center; align-items:center; padding:25px 40px; }
    .brand { display:flex; align-items:center; gap:12px; pointer-events:auto; }
    .brand-icon { width:48px; height:48px; background:linear-gradient(135deg,#f59e0b,#ef4444); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; box-shadow:0 6px 20px rgba(0,0,0,0.2); }
    .brand-text { color:#fff; font-size:1.5rem; font-weight:900; letter-spacing:1.5px; text-shadow:0 2px 10px rgba(0,0,0,0.3); }
    .brand-text span { color:#fbbf24; }

    .hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 20px; }
    .hero-badge { background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); color:#1e3a8a; padding:10px 24px; border-radius:30px; font-size:0.82rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:25px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
    .hero h1 { font-size:clamp(2rem,6vw,4.5rem); font-weight:900; color:#fff; line-height:1.1; text-shadow:0 4px 20px rgba(0,0,0,0.4); max-width:900px; margin-bottom:20px; }
    .hero h1 .gradient { background:linear-gradient(135deg,#fbbf24,#f59e0b,#ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero p { font-size:clamp(1rem,2.5vw,1.3rem); color:rgba(255,255,255,0.95); max-width:600px; line-height:1.6; margin-bottom:35px; text-shadow:0 2px 10px rgba(0,0,0,0.3); font-weight:500; }

    .stats-bar { display:flex; gap:50px; padding:25px 40px; justify-content:center; }
    .stat { text-align:center; }
    .stat-num { font-size:2rem; font-weight:900; color:#fbbf24; text-shadow:0 2px 10px rgba(0,0,0,0.3); }
    .stat-label { font-size:0.75rem; color:rgba(255,255,255,0.9); text-transform:uppercase; letter-spacing:1px; text-shadow:0 1px 5px rgba(0,0,0,0.3); }

    .loading-screen { position:fixed; inset:0; background:#87CEEB; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.6s; }
    .loading-screen.hidden { opacity:0; pointer-events:none; }
    .traffic-loader { display:flex; gap:14px; }
    .traffic-loader span { width:22px; height:22px; border-radius:50%; animation:tl 1.4s infinite; box-shadow:0 0 15px currentColor; }
    .traffic-loader span:nth-child(1){background:#ef4444;color:#ef4444;animation-delay:0s;}
    .traffic-loader span:nth-child(2){background:#f59e0b;color:#f59e0b;animation-delay:0.2s;}
    .traffic-loader span:nth-child(3){background:#10b981;color:#10b981;animation-delay:0.4s;}
    @keyframes tl{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1.3);}}
    .loading-text { color:#1e3a8a; margin-top:25px; font-size:0.95rem; font-weight:600; }

    @media (max-width:768px){ .stats-bar{gap:25px;} .stat-num{font-size:1.4rem;} .top-bar{padding:15px 20px;} }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="traffic-loader"><span></span><span></span><span></span></div>
    <div class="loading-text">Chargement de la scène 3D...</div>
  </div>

  <canvas id="canvas3d"></canvas>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">🚦</div>
        <div class="brand-text">SIG<span>EXPC</span></div>
      </div>
    </div>

    <div class="hero">
      <div class="hero-badge"><i class="fas fa-car" style="margin-right:6px;"></i>Examen du Code &amp; de la Conduite — Côte d'Ivoire</div>
      <h1>Réussissez votre <span class="gradient">permis de conduire</span></h1>
      <p>La plateforme officielle de gestion des examens du permis de conduire</p>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="stat-num">3244+</div><div class="stat-label">Candidats</div></div>
      <div class="stat"><div class="stat-num">7</div><div class="stat-label">Auto-Écoles</div></div>
      <div class="stat"><div class="stat-num">2</div><div class="stat-label">Régions</div></div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('canvas3d');
  const scene = new THREE.Scene();

  // ========== SKYBOX : dégradé ciel bleu ==========
  scene.background = new THREE.Color(0x87CEEB);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 300);
  camera.position.set(0, 12, 25);
  camera.lookAt(0, 2, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  // ========== LUMIÈRES (jour) ==========
  const ambient = new THREE.AmbientLight(0xADCBE0, 1.2);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.5);
  sun.position.set(15, 25, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
  sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
  sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 80;
  scene.add(sun);

  // ========== SOL (herbe verte) ==========
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ========== ROUTE (gris clair, bien visible) ==========
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 14),
    new THREE.MeshStandardMaterial({ color: 0x555560, roughness: 0.9 })
  );
  road.rotation.x = -Math.PI/2;
  road.position.y = 0.02;
  road.receiveShadow = true;
  scene.add(road);

  // Ligne centrale pointillée blanche
  for (let i = -35; i <= 35; i += 3) {
    const dash = new THREE.Mesh(
      new THREE.PlaneGeometry(1.8, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfffff, emissiveIntensity: 0.2 })
    );
    dash.rotation.x = -Math.PI/2;
    dash.position.set(i, 0.03, 0);
    scene.add(dash);
  }

  // Passages piétons (bandes blanches zébrées)
  for (let i = -5; i <= 5; i += 1.4) {
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(0.9, 4),
      new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 })
    );
    stripe.rotation.x = -Math.PI/2;
    stripe.position.set(i, 0.04, 5);
    scene.add(stripe);
  }

  // Trottoirs (béton clair)
  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
  for (let z of [8, -8]) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(80, 0.5, 4), sidewalkMat);
    sw.position.set(0, 0.25, z);
    sw.castShadow = true; sw.receiveShadow = true;
    scene.add(sw);
  }

  // ========== FEU TRICOLORE (gros, bien visible) ==========
  const trafficGroup = new THREE.Group();
  // Poteau (gris métallique)
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.3, 7, 16),
    new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.7, roughness: 0.3 })
  );
  pole.position.set(0, 3.5, 0);
  pole.castShadow = true;
  trafficGroup.add(pole);

  // Bras horizontal
  const arm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 3, 8),
    new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.7 })
  );
  arm.position.set(1.5, 6.5, 0);
  arm.rotation.z = Math.PI/2;
  trafficGroup.add(arm);

  // Boîtier du feu (noir mat)
  const housing = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 3, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.5, roughness: 0.4 })
  );
  housing.position.set(3, 5.2, 0);
  housing.castShadow = true;
  trafficGroup.add(housing);

  // 3 feux
  const lightColors = [0xef4444, 0xf59e0b, 0x10b981]; // rouge, orange, vert
  const trafficLights = [];
  for (let i = 0; i < 3; i++) {
    const lightMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0x000000, emissiveIntensity: 0, roughness: 0.2 })
    );
    lightMesh.position.set(3, 4.0 + i * 1.1, 0.42);
    trafficGroup.add(lightMesh);

    const halo = new THREE.PointLight(lightColors[i], 0, 12, 2);
    halo.position.copy(lightMesh.position);
    trafficGroup.add(halo);

    trafficLights.push({ mesh: lightMesh, mat: lightMesh.material, halo, color: lightColors[i] });
  }
  trafficGroup.position.set(0, 0, 7);
  scene.add(trafficGroup);

  // ========== VOITURE (rouge, détaillée) ==========
  function createCar() {
    const car = new THREE.Group();
    const bodyColor = 0xdc2626;
    // Carrosserie basse
    const lower = new THREE.Mesh(
      new THREE.BoxGeometry(3.6, 0.9, 1.6),
      new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.5, roughness: 0.25 })
    );
    lower.position.y = 0.7;
    lower.castShadow = true;
    car.add(lower);
    // Capot avant (légèrement incliné)
    const hood = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.3, 1.5),
      new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.5, roughness: 0.25 })
    );
    hood.position.set(1.6, 0.75, 0);
    car.add(hood);
    // Habitacle
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.8, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x991b1b, metalness: 0.4, roughness: 0.2 })
    );
    cabin.position.set(-0.1, 1.5, 0);
    cabin.castShadow = true;
    car.add(cabin);
    // Vitres (bleu foncé transparent)
    const winGeo = new THREE.BoxGeometry(1.7, 0.6, 1.35);
    const winMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.65 });
    const windows = new THREE.Mesh(winGeo, winMat);
    windows.position.set(-0.1, 1.55, 0);
    car.add(windows);
    // Phares avant (jaunes)
    for (let z of [0.55, -0.55]) {
      const hl = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.25, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffee88, emissiveIntensity: 1.2 })
      );
      hl.position.set(1.8, 0.8, z);
      car.add(hl);
    }
    // Feux arrière (rouges)
    for (let z of [0.55, -0.55]) {
      const tl = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.25, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff2222, emissiveIntensity: 1 })
      );
      tl.position.set(-1.8, 0.8, z);
      car.add(tl);
    }
    // Roues
    const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 20);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.85 });
    const hubMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
    const wheels = [];
    [[1.1, 0.8], [1.1, -0.8], [-1.1, 0.8], [-1.1, -0.8]].forEach(([x,z]) => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(x, 0.45, z);
      w.rotation.x = Math.PI/2;
      w.castShadow = true;
      car.add(w);
      // Moyeu (jante)
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.37, 8), hubMat);
      hub.position.copy(w.position);
      hub.rotation.x = Math.PI/2;
      car.add(hub);
      wheels.push(w);
    });
    car.userData.wheels = wheels;
    return car;
  }
  const car = createCar();
  car.position.set(-10, 0, 1.5);
  scene.add(car);

  // ========== MOTO + MOTARD ==========
  function createMotorcycle() {
    const moto = new THREE.Group();
    // Cadre/réservoir (bleu vif)
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.55, 0.55),
      new THREE.MeshStandardMaterial({ color: 0x2563eb, metalness: 0.6, roughness: 0.2 })
    );
    body.position.y = 0.75;
    body.castShadow = true;
    moto.add(body);
    // Selle (noir)
    const seat = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.2, 0.45),
      new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.9 })
    );
    seat.position.set(-0.35, 1.05, 0);
    moto.add(seat);
    // Guidon
    const handlebar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.9, 8),
      new THREE.MeshStandardMaterial({ color: 0x333, metalness: 0.8 })
    );
    handlebar.position.set(0.7, 1.2, 0);
    handlebar.rotation.x = Math.PI/2;
    moto.add(handlebar);
    // Phare moto
    const hl = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffee88, emissiveIntensity: 0.8 })
    );
    hl.position.set(0.9, 1.0, 0);
    moto.add(hl);
    // Roues
    const wGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.22, 20);
    const wMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.85 });
    const wheels = [];
    [0.8, -0.8].forEach(x => {
      const w = new THREE.Mesh(wGeo, wMat);
      w.position.set(x, 0.5, 0);
      w.rotation.x = Math.PI/2;
      w.castShadow = true;
      moto.add(w);
      wheels.push(w);
    });

    // MOTARD
    const rider = new THREE.Group();
    const jacketMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.6 });
    // Torse (penché en avant)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.38), jacketMat);
    torso.position.set(-0.05, 1.6, 0);
    torso.rotation.z = -0.15;
    torso.castShadow = true;
    rider.add(torso);
    // Bras (tendus vers guidon)
    [0.22, -0.22].forEach(z => {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.55), jacketMat);
      arm.position.set(0.35, 1.55, z);
      arm.rotation.x = 0.5;
      rider.add(arm);
    });
    // Jambes
    [0.2, -0.2].forEach(z => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.22), pantsMat);
      leg.position.set(-0.05, 0.85, z);
      rider.add(leg);
    });
    // Casque (rouge vif)
    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.26, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.4, roughness: 0.15 })
    );
    helmet.position.set(0.15, 2.25, 0);
    helmet.castShadow = true;
    rider.add(helmet);
    // Visière (noir fumé)
    const visor = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 0.12, 0.34),
      new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.7 })
    );
    visor.position.set(0.27, 2.27, 0);
    rider.add(visor);

    moto.add(rider);
    moto.userData.wheels = wheels;
    return moto;
  }
  const motorcycle = createMotorcycle();
  motorcycle.position.set(-6, 0, -2);
  scene.add(motorcycle);

  // ========== DÉCOR : Arbres (simples) ==========
  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    const x = i * 7 + (Math.random() - 0.5) * 3;
    const z = 14 + Math.random() * 6;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.4, 3, 8),
      new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 })
    );
    trunk.position.set(x, 1.5, z);
    trunk.castShadow = true;
    scene.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(1.8, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 })
    );
    leaves.position.set(x, 3.8, z);
    leaves.castShadow = true;
    scene.add(leaves);
  }

  // Nuages (sphères blanches semi-transparentes)
  for (let i = 0; i < 8; i++) {
    const cloud = new THREE.Mesh(
      new THREE.SphereGeometry(3 + Math.random()*2, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, roughness: 1 })
    );
    cloud.position.set((Math.random()-0.5)*80, 25 + Math.random()*10, -20 - Math.random()*30);
    cloud.scale.set(2, 0.8, 1);
    scene.add(cloud);
  }

  // ========== PANNEAUX DE SIGNALISATION 3D ==========
  // Crée une texture de panneau via Canvas (proche de la réalité)
  function makeSignTexture(drawFn, size = 256) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    drawFn(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    return tex;
  }

  // Panneau STOP (octogone rouge + texte blanc)
  const stopTex = makeSignTexture((ctx, s) => {
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    const cx = s/2, cy = s/2, r = s*0.45;
    for (let i = 0; i < 8; i++) {
      const a = Math.PI/8 + i * Math.PI/4;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = s*0.04; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${s*0.28}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('STOP', cx, cy);
  });

  // Panneau Sens Interdit (rond rouge + barre blanche)
  const noEntryTex = makeSignTexture((ctx, s) => {
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(s/2, s/2, s*0.45, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = s*0.03; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(s*0.18, s*0.42, s*0.64, s*0.16);
  });

  // Panneau Cédez le passage (triangle inversé rouge+blanc)
  const yieldTex = makeSignTexture((ctx, s) => {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(s*0.1, s*0.15); ctx.lineTo(s*0.9, s*0.15); ctx.lineTo(s*0.5, s*0.88); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = s*0.08; ctx.stroke();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.moveTo(s*0.25, s*0.26); ctx.lineTo(s*0.75, s*0.26); ctx.lineTo(s*0.5, s*0.72); ctx.closePath(); ctx.fill();
  });

  // Panneau vitesse (rond bleu + nombre)
  const speedTex = makeSignTexture((ctx, s) => {
    ctx.fillStyle = '#1e40af';
    ctx.beginPath(); ctx.arc(s/2, s/2, s*0.46, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = s*0.05; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${s*0.42}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('50', s/2, s/2);
  });

  // Panneau directionnel (flèche droite, rectangle bleu)
  const directionTex = makeSignTexture((ctx, s) => {
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(0, s*0.25, s, s*0.5);
    ctx.fillStyle = '#fff';
    // Flèche
    ctx.beginPath();
    ctx.moveTo(s*0.6, s*0.5); ctx.lineTo(s*0.85, s*0.5);
    ctx.lineTo(s*0.85, s*0.4); ctx.lineTo(s*0.95, s*0.5);
    ctx.lineTo(s*0.85, s*0.6); ctx.lineTo(s*0.85, s*0.5);
    ctx.fill();
    ctx.fillRect(s*0.2, s*0.43, s*0.4, s*0.14);
  });

  // Crée un panneau complet (panneau + poteau)
  function createSign(texture, x, z, rotationY = 0, panelHeight = 3.2) {
    const group = new THREE.Group();
    // Poteau
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.1, panelHeight, 8),
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.6 })
    );
    post.position.y = panelHeight / 2;
    post.castShadow = true;
    group.add(post);
    // Panneau
    const panel = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2, 1.2),
      new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, roughness: 0.5, metalness: 0.2 })
    );
    panel.position.y = panelHeight;
    panel.castShadow = true;
    group.add(panel);
    group.position.set(x, 0, z);
    group.rotation.y = rotationY;
    return group;
  }

  // Placer les panneaux autour de l'intersection
  scene.add(createSign(stopTex, -6, 5.5, -Math.PI/2));          // STOP gauche avant
  scene.add(createSign(noEntryTex, 7, -5.5, Math.PI/2));        // Sens interdit droite arrière
  scene.add(createSign(yieldTex, 7, 5.5, Math.PI/2));           // Cédez le passage droite avant
  scene.add(createSign(speedTex, -6, -5.5, -Math.PI/2));        // Vitesse 50 gauche arrière
  scene.add(createSign(directionTex, -12, 2.5, 0.3, 4));        // Directionnel plus loin gauche

  // Poteau panneau directionnel (style flèche multiple, plus grand)
  const dirPole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.12, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6 })
  );
  dirPole.position.set(12, 2.5, -2.5);
  dirPole.castShadow = true;
  scene.add(dirPole);
  const dirPanel = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 1.2),
    new THREE.MeshStandardMaterial({ map: directionTex, side: THREE.DoubleSide, roughness: 0.5 })
  );
  dirPanel.position.set(12, 4.5, -2.5);
  dirPanel.rotation.y = -Math.PI/2;
  scene.add(dirPanel);

  // ========== CYCLE DU FEU TRICOLORE ==========
  let trafficState = 0;
  let trafficTimer = 0;
  const RED_DUR = 5, GREEN_DUR = 5, ORANGE_DUR = 2;

  function setTrafficLight(state) {
    trafficLights.forEach((l, i) => {
      const on = i === state;
      l.mat.color.setHex(on ? l.color : 0x222222);
      l.mat.emissive.setHex(on ? l.color : 0x000000);
      l.mat.emissiveIntensity = on ? 1.8 : 0;
      l.halo.intensity = on ? 3 : 0;
    });
  }
  setTrafficLight(0);

  // ========== VÉHICULES ==========
  const VEHICLES = [
    { obj: car, baseX: -10, speed: 0, maxSpeed: 0.09, wheels: car.userData.wheels, wheelRadius: 0.45 },
    { obj: motorcycle, baseX: -6, speed: 0, maxSpeed: 0.085, wheels: motorcycle.userData.wheels, wheelRadius: 0.5 }
  ];

  // ========== PARALLAX SOURIS ==========
  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5);
    mouseY = (e.clientY / window.innerHeight - 0.5);
  });

  // ========== ANIMATION ==========
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    // Cycle feu
    trafficTimer += dt;
    if (trafficState === 0 && trafficTimer >= RED_DUR) { trafficState = 1; trafficTimer = 0; setTrafficLight(1); }
    else if (trafficState === 1 && trafficTimer >= GREEN_DUR) { trafficState = 2; trafficTimer = 0; setTrafficLight(2); }
    else if (trafficState === 2 && trafficTimer >= ORANGE_DUR) { trafficState = 0; trafficTimer = 0; setTrafficLight(0); }

    // Véhicules
    VEHICLES.forEach(v => {
      let target = 0;
      if (trafficState === 1) target = v.maxSpeed;
      else if (trafficState === 2) target = v.maxSpeed * 0.3;
      v.speed += (target - v.speed) * 0.04;
      v.baseX += v.speed;
      if (v.baseX > 18) v.baseX = -14;
      v.obj.position.x = v.baseX;
      const rot = v.speed / v.wheelRadius;
      v.wheels.forEach(w => { w.rotation.y += rot; });
    });

    // Parallax
    camera.position.x += (mouseX * 4 - camera.position.x) * 0.02;
    camera.position.y += (12 + mouseY * -2.5 - camera.position.y) * 0.02;
    camera.lookAt(0, 2.5, 0);

    renderer.render(scene, camera);
  }

  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
    setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; }, 600);
  }, 1000);

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
</html>
